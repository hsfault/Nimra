  if (t > 8.1 && t < 12.9) {
    strike.style.strokeDashoffset = strLen * (1 - E.inOutCubic(prog(t, 9.22, 9.55)));
    css($('lead'), 'opacity', (t > 9.4 ? lerp(1, .5, prog(t, 9.4, 9.8)) : 1).toFixed(3));
    const z = E.inExpo(prog(t, 12.25, 12.75));
    css($('s3'), 'transform', `scale(${(1 + z * .45).toFixed(4)})`);
    css($('s3'), 'opacity', (1 - z).toFixed(3));
    css($('s3'), 'filter', z > 0 ? `blur(${(z * 20).toFixed(1)}px)` : 'none');
  }

  /* S4 */
  if (t > 12.3 && t < 16) {
    const zin = E.outExpo(prog(t, 12.35, 13.0));
    css($('s4'), 'transform', `scale(${lerp(.86, 1, zin).toFixed(4)})`);
    css($('s4'), 'opacity', clamp(zin * 1.5).toFixed(3));
    css($('s4'), 'filter', zin < 1 ? `blur(${((1 - zin) * 16).toFixed(1)}px)` : 'none');
    const pb = E.inOutCubic(prog(t, 12.7, 14.1));
    busy.style.strokeDashoffset = busyLen * (1 - pb);
    const bpt = busy.getPointAtLength(busyLen * pb);
    $('busyDot').setAttribute('cx', bpt.x); $('busyDot').setAttribute('cy', bpt.y);
    css($('busyDot'), 'opacity', pb > 0 ? '1' : '0');
    const pg = E.inOutCubic(prog(t, V.l3 + 1.3, V.l3 + 2.2));
    const glen = ghostLen * pg;
    ghost.style.strokeDasharray = `2 18`; ghost.style.clipPath = `inset(0 ${(100 - pg * 100).toFixed(2)}% 0 0)`;
    const gpt = ghost.getPointAtLength(glen);
    $('ghostDot').setAttribute('cx', gpt.x); $('ghostDot').setAttribute('cy', gpt.y);
    css($('ghostDot'), 'opacity', pg > 0 ? '1' : '0');
    // shaded gap between potential and actual
    if (pg > 0) {
      const n = 24, top = [], bot = [];
      for (let i = 0; i <= n; i++) { const g = ghost.getPointAtLength(glen * i / n); top.push(`${g.x.toFixed(1)} ${g.y.toFixed(1)}`); bot.push(`${g.x.toFixed(1)} 240`); }
      $('gap').setAttribute('d', `M${top.join(' L')} L${bot.reverse().join(' L')} Z`);
    } else $('gap').setAttribute('d', '');
    css($('lblBusy'), 'opacity', prog(t, 13.9, 14.3).toFixed(3));
    css($('lblGrow'), 'opacity', prog(t, V.l3 + 2.0, V.l3 + 2.4).toFixed(3));
  }

  /* maroon wipe S4 -> S5 */
  {
    const p = E.inOutCubic(prog(t, 15.5, 16.3));
    const x = lerp(-1700, 1700, p);
    hide($('wipeM'), p > 0 && p < 1); hide($('wipeMband'), p > 0 && p < 1);
    css($('wipeM'), 'transform', `translate3d(${x.toFixed(1)}px,0,0) skewX(-10deg)`);
    css($('wipeMband'), 'transform', `translate3d(${(x + 1500).toFixed(1)}px,0,0) skewX(-10deg)`);
    css($('wipeM').firstElementChild, 'transform', `rotate(${45 - t * 160}deg)`);
  }

  /* S5 */
  if (t > 15.7 && t < 19.8) {
    const cx = 540, cy = 500;
    [0, 1, 2].forEach(i => {
      const el = $('ch' + i), st = 16.15 + i * .2;
      const p = E.outBack(prog(t, st, st + .5));
      const a = (t - 16) * 1.5 + i * Math.PI * 2 / 3;
      const depth = Math.sin(a);                      // >0 = in front
      const x = cx + Math.cos(a) * 370, y = cy + depth * 70 - 0;
      const s = p * lerp(.72, 1.08, (depth + 1) / 2) * (1 - E.inCubic(prog(t, 19.1, 19.5)));
      css(el, 'transform', `translate3d(${(x - 48).toFixed(1)}px,${(y - 48).toFixed(1)}px,0) scale(${s.toFixed(3)})`);
      css(el, 'opacity', (clamp(p * 2) * lerp(.2, 1, (depth + 1) / 2)).toFixed(3));
      css(el, 'zIndex', depth > 0 ? '2' : '0');
      css(el.querySelector('.ok'), 'transform', `scale(${E.outBack(prog(t, st + .5, st + .8)).toFixed(3)})`);
    });
    const r = E.inOutCubic(prog(t, 16.9, 17.5));
    $('r5l').setAttribute('x2', lerp(420, 40, r)); $('r5r').setAttribute('x2', lerp(480, 860, r));
    css($('r5d'), 'opacity', prog(t, 16.9, 17.1).toFixed(3));
    sceneOut($('s5'), t, 19.1, 19.55, -60, 10);
  }

  /* S6 */
  if (t > 19.2 && t < 24) {
    const bp = E.outBack(prog(t, 22.35, 22.8));
    css($('cbub'), 'transform', `scale(${bp.toFixed(3)}) translateY(${(Math.sin(t * 2) * 6).toFixed(1)}px)`);
    css($('cbub'), 'transformOrigin', '0% 100%');
    [...$('cbub').children].forEach((d, i) => css(d, 'transform', `translateY(${(Math.max(0, Math.sin(t * 7 - i * .8)) * -12).toFixed(1)}px)`));
    sceneOut($('s6'), t, 23.4, 23.95, -120, 16);
  }

  /* S7 logo */
  if (t > 23.4) {
    const m = E.inOutCubic(prog(t, 24.05, 24.6));
    css($('lMark'), 'webkitMaskImage', m >= 1 ? 'none' : `conic-gradient(from 200deg, #000 ${(m * 360).toFixed(1)}deg, transparent ${(m * 360 + .5).toFixed(1)}deg)`);
    css($('lMark'), 'transform', `scale(${lerp(1.08, 1, E.outCubic(prog(t, 24.05, 24.9))).toFixed(4)})`);
    css($('lMark'), 'filter', m < 1 ? `blur(${((1 - m) * 6).toFixed(1)}px)` : 'none');
    css($('lMark'), 'opacity', clamp(m * 4).toFixed(3));
    const sh = prog(t, 25.2, 26.1);
    css($('lSheen'), 'backgroundPosition', `${lerp(100, 0, sh).toFixed(1)}% 0`);
    css($('lSheen'), 'opacity', sh > 0 && sh < 1 ? '1' : '0');
    const n = E.outExpo(prog(t, 24.6, 25.5));
    css($('lName'), 'clipPath', `inset(0 ${((1 - n) * 50).toFixed(2)}% 0 ${((1 - n) * 50).toFixed(2)}%)`);
    css($('lName'), 'transform', `translateY(${((1 - n) * 24).toFixed(1)}px)`);
    const r = E.inOutCubic(prog(t, 25.6, 26.3));
    css($('lRule'), 'clipPath', `inset(0 ${((1 - r) * 50).toFixed(2)}% 0 ${((1 - r) * 50).toFixed(2)}%)`);
    const g = E.outCubic(prog(t, 26.0, 26.7));
    css($('lTag'), 'opacity', g.toFixed(3)); css($('lTag'), 'transform', `translateY(${((1 - g) * 22).toFixed(1)}px)`);
    css($('logoGrp'), 'transform', `scale(${lerp(1, 1.035, prog(t, 24.4, 29.5)).toFixed(4)})`);
  }
}

function renderFrame(t) {
  const frame = Math.round(t * TL.fps);
  wordsFrame(t);
  nimraFrame(t);
  domFrame(t, frame);
  glFrame(t);
}
window.renderFrame = renderFrame;
window.DURATION = TL.duration;
window.FPS = TL.fps;

await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
await document.fonts.ready;
for (const f of ['700 80px Playfair', '800 80px Playfair', 'italic 800 80px Playfair', 'italic 700 80px Playfair', '700 40px Cinzel', '600 20px Poppins', '500 20px Poppins'])
  await document.fonts.load(f);

const q = new URLSearchParams(location.search);
if (q.has('t')) { renderFrame(+q.get('t')); window.ready = true; }
else if (q.has('render')) { renderFrame(0); window.ready = true; }
else {
  const t0 = performance.now();
  const loop = () => { renderFrame(((performance.now() - t0) / 1000) % TL.duration); requestAnimationFrame(loop); };
  loop(); window.ready = true;
}
</script>
</body>
</html>
